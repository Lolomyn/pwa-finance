<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2c3e50">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Расходы">
  <title>Мои расходы</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Мои расходы</h1>
    </header>

    <p id="app-error" class="app-error" role="alert" hidden></p>

    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">Новая трата</h2>

      <form id="expense-form" novalidate>
        <div class="field">
          <label for="amount">Сумма</label>
          <input
            id="amount"
            name="amount"
            type="number"
            step="0.01"
            min="0.01"
            inputmode="decimal"
            placeholder="Сумма"
            required
          >
        </div>

        <div class="field">
          <label for="category">Категория</label>
          <select id="category" name="category" required>
            <option value="Еда">Еда</option>
            <option value="Транспорт">Транспорт</option>
            <option value="Жильё">Жильё</option>
            <option value="Развлечения">Развлечения</option>
            <option value="Другое">Другое</option>
          </select>
        </div>

        <div class="field">
          <label for="date">Дата траты</label>
          <input id="date" name="date" type="date" required>
        </div>

        <div class="field">
          <label for="note">Заметка</label>
          <input
            id="note"
            name="note"
            type="text"
            placeholder="Заметка (необязательно)"
          >
        </div>

        <button class="submit-button" type="submit">Добавить трату</button>
      </form>
    </section>

    <div class="total" aria-live="polite">
      <span class="total-label">Итого за всё время:</span>
      <strong id="total-amount" class="total-value">0 ₽</strong>
    </div>

    <section class="stats" aria-labelledby="stats-title">
      <h2 id="stats-title">Статистика</h2>

      <div id="period-tabs" class="period-tabs" role="tablist" aria-label="Период статистики">
        <button
          type="button"
          class="period-tab"
          data-period="week"
          role="tab"
          aria-selected="false"
          aria-controls="stats-panel"
        >Неделя</button>
        <button
          type="button"
          class="period-tab is-active"
          data-period="month"
          role="tab"
          aria-selected="true"
          aria-controls="stats-panel"
        >Месяц</button>
        <button
          type="button"
          class="period-tab"
          data-period="year"
          role="tab"
          aria-selected="false"
          aria-controls="stats-panel"
        >Год</button>
        <button
          type="button"
          class="period-tab"
          data-period="all"
          role="tab"
          aria-selected="false"
          aria-controls="stats-panel"
        >Всё</button>
      </div>

      <div id="stats-panel" class="stats-panel" role="tabpanel" aria-label="Статистика за выбранный период">
        <div class="stats-cards">
          <div class="stats-card">
            <span class="stats-label">Итого за период:</span>
            <strong id="stats-total" class="stats-value">0 ₽</strong>
          </div>

          <div class="stats-card">
            <span class="stats-label">Средний расход в день:</span>
            <strong id="stats-avg" class="stats-value">0 ₽</strong>
          </div>
        </div>

        <div class="stats-card stats-card--chart">
          <span class="stats-label">Динамика:</span>
          <div id="stats-chart" class="stats-chart"></div>
        </div>

        <div class="stats-card stats-card--categories">
          <span class="stats-label">По категориям:</span>
          <ul id="stats-categories" class="stats-categories" hidden></ul>
          <p id="stats-empty" class="stats-empty">Нет данных за период</p>
        </div>
      </div>
    </section>

    <section class="expenses" aria-labelledby="expenses-title">
      <h2 id="expenses-title">Траты</h2>
      <p id="empty-state" class="empty-state">Пока нет трат</p>
      <ul id="expense-list" class="expense-list"></ul>
    </section>
  </main>

  <script>
    window.addEventListener('load', () => {
      if (!('serviceWorker' in navigator)) {
        return;
      }

      navigator.serviceWorker.register('./sw.js').catch((error) => {
        console.error('Не удалось зарегистрировать service worker:', error);
      });
    });
  </script>
</body>
</html>
