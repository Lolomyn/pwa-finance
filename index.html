<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2c3e50">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Расходы">
  <title>Мои расходы</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Мои расходы</h1>
    </header>

    <p id="app-error" class="app-error" role="alert" hidden></p>

    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">Новая трата</h2>

      <form id="expense-form" novalidate>
        <div class="field">
          <label for="amount">Сумма</label>
          <input
            id="amount"
            name="amount"
            type="number"
            step="0.01"
            min="0.01"
            inputmode="decimal"
            placeholder="Сумма"
            required
          >
        </div>

        <div class="field">
          <label for="category">Категория</label>
          <select id="category" name="category" required>
            <option value="Еда">Еда</option>
            <option value="Транспорт">Транспорт</option>
            <option value="Жильё">Жильё</option>
            <option value="Развлечения">Развлечения</option>
            <option value="Другое">Другое</option>
          </select>
        </div>

        <div class="field">
          <label for="date">Дата траты</label>
          <input id="date" name="date" type="date" required>
        </div>

        <div class="field">
          <label for="note">Заметка</label>
          <input
            id="note"
            name="note"
            type="text"
            placeholder="Заметка (необязательно)"
          >
        </div>

        <button class="submit-button" type="submit">Добавить трату</button>
      </form>
    </section>

    <div class="total" aria-live="polite">
      <span class="total-label">Итого:</span>
      <strong id="total-amount" class="total-value">0 ₽</strong>
    </div>

    <section class="expenses" aria-labelledby="expenses-title">
      <h2 id="expenses-title">Траты</h2>
      <p id="empty-state" class="empty-state">Пока нет трат</p>
      <ul id="expense-list" class="expense-list"></ul>
    </section>
  </main>

  <script>
    window.addEventListener('load', () => {
      if (!('serviceWorker' in navigator)) {
        return;
      }

      navigator.serviceWorker.register('./sw.js').catch((error) => {
        console.error('Не удалось зарегистрировать service worker:', error);
      });
    });
  </script>
</body>
</html>
