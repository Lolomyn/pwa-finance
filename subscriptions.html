<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="app-access.css">
<script src="app-access.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FAF6EF">
<script>
  (function () {
    try {
      if (localStorage.getItem('expense-tracker-theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute('content', '#141311');
        }
      }
    } catch (error) {}
  })();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Подписки">
<meta name="description" content="Подписки, регулярные платежи и кэшбэк. Работают офлайн.">
<title>Подписки и платежи</title>
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="subscriptions.css">
<link rel="stylesheet" href="update-banner.css">
<script src="subscriptions.js" defer></script>
<script src="update-banner.js" defer></script>
</head>
<body>

<div class="stage">
  <div class="screen-app active" id="appScreen">
    <div class="app-scroll">
      <header class="appbar">
        <button class="back-btn" id="backBtn" type="button" aria-label="Вернуться в хаб" title="В хаб">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="header-title">Подписки</div>
      </header>

      <div class="hero-card">
        <div class="hero-lbl">Известные траты</div>
        <div class="hero-val" id="heroTotal">0<span class="cur">₽</span></div>
        <div class="hero-sub">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
          <span id="heroNext">Ближайшее списание: нет</span>
        </div>
      </div>

      <div class="section-title">
        Мои подписки
        <span class="section-count" id="countSubs">0</span>
      </div>
      <div id="subsList"></div>

      <div class="section-title" style="margin-top:24px;">
        Мои платежи
        <span class="section-count" id="countPays">0</span>
      </div>
      <div id="paysList"></div>

      <div class="section-title" style="margin-top:24px;">
        Мой кэшбэк
        <div class="cb-month-nav">
          <button class="cb-month-btn" id="cbPrev" type="button" aria-label="Предыдущий месяц">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <div class="cb-month-label" id="cbMonthLabel" aria-live="polite">Октябрь 2026</div>
          <button class="cb-month-btn" id="cbNext" type="button" aria-label="Следующий месяц">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>
      </div>
      <div id="cashbackList"></div>
    </div>

    <button class="fab" id="fabAdd" type="button" aria-label="Добавить запись" title="Добавить запись">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>
  </div>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="modal-sheet" id="modalSheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <div class="sheet-title" id="modalTitle">Новая запись</div>
  </div>
  <div class="modal-body" id="modalContent"></div>
</div>

</body>
</html>
